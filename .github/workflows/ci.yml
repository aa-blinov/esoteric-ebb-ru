name: ci

# The translation is a data package, so the build is the test: the shipped
# CSV files are read the way the game reads them, and checked against the
# manifest of the English source. The house-style check is a separate
# workflow, so that a failure of the standard is visibly different from a
# failure of the data.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Test
        run: python3 -m unittest discover -s tests -v

      - name: The files are the same everywhere
        run: |
          python3 - <<'PY'
          import csv, hashlib, os, sys
          root = "translation/Russian"
          digests = {}
          for name in sorted(os.listdir(root)):
              if not name.endswith(".csv"):
                  continue
              with open(os.path.join(root, name), "rb") as fh:
                  digests[name] = hashlib.sha256(fh.read()).hexdigest()
          for name, digest in digests.items():
              print("%-16s %s" % (name, digest[:16]))
          PY
