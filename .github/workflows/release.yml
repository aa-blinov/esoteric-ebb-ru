name: release

# Tag-triggered release. A tag of v* produces a release with the artefacts
# the project ships, and the changelog section for that version becomes the
# release body.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the release commit
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m unittest discover -s tests -v

      - name: Extract the version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Build
        run: |
          python3 - "${{ steps.version.outputs.version }}" <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          version = sys.argv[1]
          source = Path("translation/Russian")
          files = sorted(source.glob("*.csv"))
          if len(files) != 12:
              raise SystemExit(f"Expected 12 localization CSV files, found {len(files)}")

          output = Path("dist") / f"esoteric-ebb-ru-v{version}.zip"
          output.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in files:
                  archive.write(path, Path("Russian") / path.name)

          notes = Path("docs/releases") / f"v{version}.md"
          if not notes.is_file():
              raise SystemExit(f"Release notes not found: {notes}")
          print(f"Built {output} with {len(files)} CSV files")

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: Esoteric Ebb RU v${{ steps.version.outputs.version }}
          body_path: docs/releases/v${{ steps.version.outputs.version }}.md
          files: dist/esoteric-ebb-ru-v${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true
