version: 2

# Dependency updates are the cheapest maintenance a repository can do, and
# dependabot's grouping keeps the pull requests small enough to review.
# Only the two ecosystems this repository actually uses are watched.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    groups:
      actions:
        # The house standard is excluded on purpose. Dependabot reads the
        # reference to it as a dependency, but it does not propose a bump for
        # a standard published in the same repository as its own tooling.
        # The bump workflow in aa-blinov/golden-repo opens that pull request
        # instead, and it arrives on its own.
        patterns: ['*', '!aa-blinov/golden-repo']

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, python]
    groups:
      python:
        patterns: ['*']
